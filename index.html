<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retold</title>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/components.css">
  <style>
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: var(--space-xl);
    }
    .splash-logo {
      margin-bottom: var(--space-lg);
      filter: drop-shadow(0 0 16px rgba(217, 119, 6, 0.4));
    }
    .splash-title {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--color-primary);
      letter-spacing: 4px;
      margin-bottom: var(--space-xs);
    }
    .splash-subtitle {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--color-text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: var(--space-xxl);
    }
    .splash-nav {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
      justify-content: center;
    }
    .splash-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-md);
      padding: var(--space-xl);
      width: 280px;
      text-align: left;
      text-decoration: none;
      color: var(--color-text-main);
      transition: border-color 180ms var(--ease-out), transform 180ms var(--ease-out);
    }
    .splash-card:hover {
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }
    .splash-card:active {
      transform: scale(0.97);
    }
    .splash-card h2 {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--color-primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: var(--space-sm);
    }
    .splash-card p {
      font-size: 14px;
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .splash-tagline {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--color-text-muted);
      letter-spacing: 0.5px;
      margin-top: var(--space-xxl);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="assets/logo.svg" alt="Retold" class="splash-logo" width="64" height="64">
    <h1 class="splash-title">RETOLD</h1>
    <p class="splash-subtitle">Text Adventures in The Big <span id="current-year"></span></p>

    <nav class="splash-nav">
      <a href="editor/editor.html" class="splash-card">
        <h2>&#x25B6; Story Editor</h2>
        <p>Author branching stories visually. Create nodes, write prose, link choices, and export as JSON.</p>
      </a>
      <a href="player/player.html" class="splash-card">
        <h2>&#x25B6; Story Player</h2>
        <p>Load a story and play through it as a text adventure. Your progress saves automatically.</p>
      </a>
    </nav>

    <p class="splash-tagline">Made with Love!</p>
  </div>
  <script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
</body>
</html>
